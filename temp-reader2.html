<!doctype html><meta charset="utf-8"><title>reader2</title><input type="file" id="f"><button id="c">Copy</button><span id="n"></span><pre id="o"></pre><script>var t='';document.getElementById('f').addEventListener('change',function(e){var r=new FileReader();r.onload=function(){t=r.result;document.getElementById('o').textContent=t;document.getElementById('n').textContent='len='+t.length};r.readAsText(e.target.files[0])});document.getElementById('c').addEventListener('click',function(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();document.getElementById('n').textContent+=' copied'});</script>
