<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>read</title></head>
<body>
<p>Pick a file to view its text (read locally in your browser only, nothing is sent anywhere):</p>
<input type="file" id="f">
<br><br>
<textarea id="out" rows="20" cols="100" readonly placeholder="File contents appear here"></textarea>
<script>
document.getElementById('f').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => { document.getElementById('out').value = r.result; };
  r.readAsText(file);
});
</script>
</body>
</html>
